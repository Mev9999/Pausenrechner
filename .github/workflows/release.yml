name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Version lesen
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          "value=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Pruefen, ob Release schon existiert
        id: release_check
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $url = "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ steps.version.outputs.tag }}"

          try {
            Invoke-RestMethod -Uri $url -Headers $headers -Method Get | Out-Null
            "exists=true" >> $env:GITHUB_OUTPUT
          } catch {
            $statusCode = $_.Exception.Response.StatusCode.value__
            if ($statusCode -eq 404) {
              "exists=false" >> $env:GITHUB_OUTPUT
            } else {
              throw
            }
          }

      - name: Abhaengigkeiten installieren
        if: steps.release_check.outputs.exists != 'true'
        run: npm ci

      - name: Windows-Installer bauen
        if: steps.release_check.outputs.exists != 'true'
        run: npm run build

      - name: GitHub Release veroeffentlichen
        if: steps.release_check.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Pausenrechner v${{ steps.version.outputs.value }}
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml

      - name: Hinweis bei unveraenderter Version
        if: steps.release_check.outputs.exists == 'true'
        shell: pwsh
        run: |
          Write-Host "Release ${{ steps.version.outputs.tag }} existiert bereits."
          Write-Host "Bitte die Versionsnummer in package.json erhoehen, damit ein neues Update fuer die Clients entsteht."
