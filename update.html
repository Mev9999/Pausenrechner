<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Update wird gesucht...</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding-top: 30px;
      background-color: #f4f4f4;
      border-radius: 12px;
      opacity: 0;
      animation: fadeIn 1s ease forwards;
    }

    img {
      width: 180px;
      margin-bottom: 20px;
      animation: fadeIn 1s ease forwards;
    }

    h3 {
      margin: 10px 0;
      font-weight: normal;
      color: #333;
      min-height: 24px;
    }

    #spinner {
      margin: 20px auto;
      width: 40px;
      height: 40px;
      border: 4px solid #ccc;
      border-top: 4px solid #d7261e;
      border-radius: 50%;
      animation: spin 1s linear infinite, pulse 1.5s ease-in-out infinite;
    }

    #progress-container {
      width: 80%;
      margin: 20px auto;
      background: #eee;
      border-radius: 5px;
      overflow: hidden;
      display: none;
    }

    #progress {
      width: 0;
      height: 10px;
      background: #d7261e;
      transition: width 0.4s ease;
    }

    .fade-success {
      color: green;
      animation: successFade 1s forwards;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes successFade {
      0% { color: #333; transform: scale(1); }
      50% { color: green; transform: scale(1.1); }
      100% { color: green; transform: scale(1); }
    }
  </style>
</head>
<body>

  <h3 id="message">🔍 Es wird nach Updates gesucht<span id="dots">.</span></h3>

  <div id="spinner"></div>

  <div id="progress-container">
    <div id="progress"></div>
  </div>

  <script>
    const path = require('path');
    const { ipcRenderer } = require('electron');
    const messageEl = document.getElementById('message');
    const spinner = document.getElementById('spinner');
    const progressContainer = document.getElementById('progress-container');
    const progress = document.getElementById('progress');
    const dots = document.getElementById('dots');

    const logo = document.createElement('img');
    logo.src = path.join(__dirname, 'logo-hsp-serviceline-1024x289.png').replace(/\\/g, '/');
    logo.alt = 'Logo';
    logo.style.width = '180px';
    document.body.prepend(logo);
    
    let dotCount = 1;
    setInterval(() => {
      dotCount = (dotCount % 3) + 1;
      dots.textContent = '.'.repeat(dotCount);
    }, 500);

    ipcRenderer.on('update-message', (event, message) => {
      messageEl.innerText = message;

      if (message.includes('Update verfügbar') || message.includes('wird geladen')) {
        spinner.style.display = 'none';
        progressContainer.style.display = 'block';
      }

      if (message.includes('Update abgeschlossen') || message.includes('Update geladen')) {
        messageEl.classList.add('fade-success');
      }

      if (message.includes('Keine Updates verfügbar') || message.includes('Fehler beim Update')) {
        spinner.style.display = 'none';
      }
    });

    ipcRenderer.on('update-progress', (event, percent) => {
      progress.style.width = percent + '%';
    });
  </script>
</body>
</html>
